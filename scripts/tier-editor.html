<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>mousedle 难度分级编辑器</title>
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #fffdf8;
    --border: #cec6bc;
    --text: #24211d;
    --text-sec: #625c54;
    --primary: #c83d00;
    --primary-soft: rgba(200, 61, 0, 0.1);
    --col-easy: #16875b;
    --col-normal: #005fae;
    --col-hard: #625c54;
    --col-disabled: #ba1a1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; }
  header .hint { font-size: 12px; color: var(--text-sec); }
  header .spacer { flex: 1; }
  label.toggle { font-size: 13px; display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap; }
  input[type="search"] {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    font-size: 13px;
    width: 220px;
    background: var(--surface);
  }
  button {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button:hover { filter: brightness(0.97); }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1.1fr 1.3fr 1fr;
    gap: 12px;
    padding: 12px 16px 20px;
    min-height: 0;
  }
  .column {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    min-height: 0;
  }
  .column-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  .column-header h2 { margin: 0; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .column-header h2::before {
    content: '';
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: var(--col);
  }
  .column-header h2 .key {
    font-size: 11px;
    color: var(--text-sec);
    font-weight: 400;
    margin-left: 2px;
  }
  .column-header .meta { font-size: 12px; color: var(--text-sec); margin-top: 2px; }
  .cards {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 0;
  }
  .column.drag-over .cards { background: var(--primary-soft); outline: 2px dashed var(--primary); outline-offset: -6px; border-radius: 6px; }
  .card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
  }
  .card:not(.expanded) { cursor: grab; }
  .card:not(.expanded):active { cursor: grabbing; }
  .card.dragging { opacity: 0.4; }
  .card.selected { outline: 2px solid var(--primary); outline-offset: -1px; background: var(--primary-soft); }
  .card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 12px;
    cursor: pointer;
    user-select: none;
  }
  .card-head .count { color: var(--text-sec); font-size: 12px; white-space: nowrap; }
  .card-head .chev { color: var(--text-sec); font-size: 11px; white-space: nowrap; }
  .models {
    display: none;
    max-height: 46vh;
    overflow-y: auto;
    margin: 0 8px 8px;
    padding: 6px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 4px;
    align-content: flex-start;
  }
  .card.expanded .models { display: flex; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 3px 7px;
    border: 1px solid var(--border);
    border-radius: 5px;
    background: var(--surface);
    font-size: 12px;
    line-height: 1.5;
    cursor: pointer;
    user-select: none;
    border-left-width: 3px;
  }
  .chip:hover { border-color: var(--primary); }
  .chip.selected { outline: 2px solid var(--primary); outline-offset: -1px; background: var(--primary-soft); font-weight: 600; }
  .chip .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex: none;
  }
  .chip .hint-tag { color: var(--text-sec); font-size: 10px; border: 1px solid var(--border); border-radius: 3px; padding: 0 2px; }
  .chip img { max-height: 18px; max-width: 30px; object-fit: contain; }
  .chip.t-easy { border-left-color: var(--col-easy); }
  .chip.t-easy .dot { background: var(--col-easy); }
  .chip.t-normal { border-left-color: var(--col-normal); }
  .chip.t-normal .dot { background: var(--col-normal); }
  .chip.t-hard { border-left-color: var(--col-hard); }
  .chip.t-hard .dot { background: var(--col-hard); }
  .chip.t-disabled { border-left-color: var(--col-disabled); }
  .chip.t-disabled .dot { background: var(--col-disabled); opacity: 0.25; }
  .chip.hidden { display: none; }
  .empty-tip {
    text-align: center;
    color: var(--text-sec);
    font-size: 12px;
    padding: 20px 0;
  }
  #selection-bar {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    background: #312b25;
    color: #f9eee8;
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 13px;
    display: none;
    align-items: center;
    gap: 14px;
    z-index: 60;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  #selection-bar.show { display: flex; }
  #selection-bar .keys { color: #d8c9bf; font-size: 12px; }
  #review {
    position: fixed;
    top: 54px;
    right: 16px;
    width: 340px;
    max-height: 72vh;
    overflow-y: auto;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    padding: 10px 12px;
    display: none;
    z-index: 50;
    font-size: 12px;
  }
  #review.show { display: block; }
  #review h3 { margin: 4px 0 6px; font-size: 13px; }
  #review .group-title { font-weight: 700; margin: 8px 0 3px; }
  #review .row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 0;
    border-bottom: 1px dashed var(--border);
  }
  #review .row .name { flex: 1; }
  #review .row .from { color: var(--text-sec); white-space: nowrap; }
  #review .row button { padding: 0 6px; font-size: 11px; line-height: 1.6; }
  #review .none { color: var(--text-sec); padding: 6px 0; }
  #toast {
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: #312b25;
    color: #f9eee8;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 99;
  }
  #toast.show { opacity: 1; }
</style>
</head>

<header>
  <h1>鼠一把 · 难度分级编辑器</h1>
  <span class="hint">点品牌行展开型号；点型号芯片多选（Shift 连选），按 1 小白 / 2 潮男 / 3 扫地僧 / 4 禁用 分档，Esc 取消；收起的品牌卡可整卡拖到目标列。</span>
  <input type="search" id="search" placeholder="搜索品牌或型号…" />
  <label class="toggle"><input type="checkbox" id="only-overrides" />只看调档</label>
  <button id="review-toggle">调档清单</button>
  <button id="reset">还原已落库名单</button>
  <button id="download" class="primary">导出 JSON</button>
</header>
<main id="board"></main>
<div id="selection-bar"><span id="selection-count"></span><span class="keys">1 小白 · 2 潮男 · 3 扫地僧 · 4 禁用 · Esc 取消</span></div>
<div id="review"></div>
<div id="toast"></div>

{"n":"Xenics Titan GX Air Wireless","s":"Titan GX Air Wireless","img":"xenics-titan-gx-air-wireless.png"}]},{"brand":"XIBERIA","count":1,"tier":"disabled","models":[{"n":"XIBERIA EX","s":"EX","img":"xiberia-ex.png"}]},{"brand":"Xinshuntian","count":1,"tier":"disabled","models":[{"n":"Xinshuntian G820","s":"G820","img":"xinshuntian-g820.png"}]},{"brand":"xtro","count":1,"tier":"disabled","models":[{"n":"xtro Eris","s":"Eris","img":"xtro-eris.png"}]},{"brand":"Xyder","count":1,"tier":"disabled","models":[{"n":"Xyder Amalight 4K","s":"Amalight 4K","img":"xyder-amalight-4k.png"}]},{"brand":"YUNZII","count":1,"tier":"disabled","models":[{"n":"YUNZII M1","s":"M1","img":"yunzii-m1.png"}]},{"brand":"zeromouse","count":1,"tier":"hard","models":[{"n":"zeromouse Blade","s":"Blade","img":"zeromouse-blade.png"}]}];

const TIERS = [
  { key: 'easy', label: '小白（easy）', colVar: '--col-easy' },
  { key: 'normal', label: '潮男（normal，含小白）', colVar: '--col-normal' },
  { key: 'hard', label: '扫地僧（hard，含全部）', colVar: '--col-hard' },
  { key: 'disabled', label: '禁用（不进游戏）', colVar: '--col-disabled' },
];
const TIER_LABEL = Object.fromEntries(TIERS.map((t) => [t.key, t.label]));
const TIER_ORDER = Object.fromEntries(TIERS.map((t, i) => [t.key, i]));

const brandOf = {};
for (const b of BRANDS) for (const m of b.models) brandOf[m.n] = b.brand;

// 编辑器数据块烘焙的是已落库状态:品牌档 = tier,型号覆写 = models[].o。
const initialState = Object.fromEntries(BRANDS.map((b) => [b.brand, b.tier]));
const initialOverrides = {};
for (const b of BRANDS) for (const m of b.models) if (m.o) initialOverrides[m.n] = m.o;

let state = { ...initialState };
let overrides = { ...initialOverrides };
let expanded = new Set();
let selectedModels = new Set();
let selectedBrand = null;
let lastChip = null; // { brand, idx } 供 Shift 连选

const STORAGE_KEY = 'mousedle-tier-editor-v3';
try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) ?? 'null');
  if (saved && typeof saved === 'object') {
    for (const [brand, tier] of Object.entries(saved.state ?? {})) {
      if (brand in state && TIERS.some((t) => t.key === tier)) state[brand] = tier;
    }
    for (const [name, tier] of Object.entries(saved.overrides ?? {})) {
      if (name in brandOf && TIERS.some((t) => t.key === tier)) overrides[name] = tier;
    }
  }
} catch { /* 损坏的存档按已落库名单处理 */ }

function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ state, overrides })); }
  catch { /* 忽略隐私模式 */ }
}

const board = document.getElementById('board');
const columns = {};

function effectiveTier(name) {
  return overrides[name] ?? state[brandOf[name]];
}

for (const tier of TIERS) {
  const col = document.createElement('section');
  col.className = 'column';
  col.dataset.tier = tier.key;
  col.innerHTML = `
    <div class="column-header" style="--col: var(${tier.colVar})">
      <h2>${tier.label}<span class="key">${TIERS.indexOf(tier) + 1}</span></h2>
      <div class="meta"></div>
    </div>
    <div class="cards"></div>`;
  col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('drag-over'); });
  col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
  col.addEventListener('drop', (e) => {
    e.preventDefault();
    col.classList.remove('drag-over');
    const payload = e.dataTransfer.getData('text/plain');
    if (payload.startsWith('brand:')) {
      const brand = payload.slice(6);
      if (state[brand] !== tier.key) { state[brand] = tier.key; cleanOverrides(brand); persist(); render(); }
    }
  });
  // 点列空白:有选中的型号就分档型号,否则分档选中的品牌
  col.addEventListener('click', () => {
    if (selectedModels.size) assignModels([...selectedModels], tier.key);
    else if (selectedBrand) { state[selectedBrand] = tier.key; cleanOverrides(selectedBrand); persist(); render(); }
  });
  board.appendChild(col);
  columns[tier.key] = col;
}

// 型号覆写是绝对档;品牌挪档后,等于新品牌档的覆写就是冗余,顺手清掉。
function cleanOverrides(brand) {
  for (const m of BRANDS.find((b) => b.brand === brand).models) {
    if (overrides[m.n] === state[brand]) delete overrides[m.n];
  }
}

function assignModels(names, tierKey) {
  for (const name of names) {
    if (tierKey === state[brandOf[name]]) delete overrides[name];
    else overrides[name] = tierKey;
  }
  selectedModels.clear();
  lastChip = null;
  persist();
  refreshChips(names);
  updateMetas();
  renderReview();
  updateSelectionBar();
}

function toggleChip(name, brand, idx, shift) {
  if (shift && lastChip && lastChip.brand === brand) {
    const models = BRANDS.find((b) => b.brand === brand).models;
    const [a, b2] = [lastChip.idx, idx].sort((x, y) => x - y);
    for (let i = a; i <= b2; i++) selectedModels.add(models[i].n);
  } else if (selectedModels.has(name)) {
    selectedModels.delete(name);
  } else {
    selectedModels.add(name);
  }
  lastChip = { brand, idx };
  selectedBrand = null;
  document.querySelectorAll('.card.selected').forEach((el) => el.classList.remove('selected'));
  refreshChipSelection();
  updateSelectionBar();
}

function refreshChipSelection() {
  document.querySelectorAll('.chip').forEach((el) => {
    el.classList.toggle('selected', selectedModels.has(el.dataset.name));
  });
}

function refreshChips(names) {
  for (const name of names) {
    const el = document.querySelector(`.chip[data-name="${CSS.escape(name)}"]`);
    if (!el) continue;
    const t = effectiveTier(name);
    el.classList.remove('t-beginner', 't-easy', 't-normal', 't-disabled');
    el.classList.add('t-' + t);
    el.title = `${name} · 当前:${TIER_LABEL[t]} · 品牌档:${TIER_LABEL[state[brandOf[name]]]}`;
  }
}

function updateSelectionBar() {
  const bar = document.getElementById('selection-bar');
  document.getElementById('selection-count').textContent =
    selectedModels.size ? `已选 ${selectedModels.size} 只型号` : '';
  bar.classList.toggle('show', selectedModels.size > 0);
}

function chipVisible(m, q, onlyOv) {
  const overridden = Boolean(overrides[m.n]);
  if (onlyOv && !overridden) return false;
  if (!q) return true;
  return m.s.toLowerCase().includes(q) || m.n.toLowerCase().includes(q);
}

function render() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const onlyOv = document.getElementById('only-overrides').checked;
  const totals = Object.fromEntries(TIERS.map((t) => [t.key, { brands: 0, mice: 0, ov: 0 }]));
  for (const tier of TIERS) {
    const cards = columns[tier.key].querySelector('.cards');
    cards.innerHTML = '';
    const brands = BRANDS.filter((b) => state[b.brand] === tier.key);
    for (const b of brands) {
      totals[tier.key].brands++;
      totals[tier.key].mice += b.count;
      totals[tier.key].ov += b.models.filter((m) => overrides[m.n]).length;
      const isOpen = expanded.has(b.brand);
      const visModels = b.models.filter((m) => chipVisible(m, q, onlyOv));
      if ((onlyOv || q) && !visModels.length) continue;
      const card = document.createElement('div');
      card.className = 'card' + (isOpen ? ' expanded' : '') + (selectedBrand === b.brand ? ' selected' : '');
      card.dataset.brand = b.brand;
      card.draggable = !isOpen;
      const head = document.createElement('div');
      head.className = 'card-head';
      head.innerHTML = `<span>${b.brand}</span><span class="count">${b.count} 型号</span>`
        + `<span class="chev">${isOpen ? '收起' : '展开'}</span>`;
      head.addEventListener('click', (e) => {
        e.stopPropagation();
        selectedModels.clear();
        lastChip = null;
        if (expanded.has(b.brand) && selectedBrand === b.brand) {
          expanded.delete(b.brand);
          selectedBrand = null;
        } else {
          expanded.add(b.brand);
          selectedBrand = b.brand;
        }
        updateSelectionBar();
        render();
      });
      card.appendChild(head);
      if (isOpen) {
        const box = document.createElement('div');
        box.className = 'models';
        b.models.forEach((m, idx) => {
          if (!chipVisible(m, q, onlyOv)) return;
          const t = effectiveTier(m.n);
          const chip = document.createElement('span');
          chip.className = 'chip t-' + t + (selectedModels.has(m.n) ? ' selected' : '');
          chip.dataset.name = m.n;
          chip.title = `${m.n} · 当前:${TIER_LABEL[t]} · 品牌档:${TIER_LABEL[state[brandOf[m.n]]]}`;
          const dot = `<span class="dot" style="visibility:${overrides[m.n] ? 'visible' : 'hidden'}"></span>`;
          const img = IMAGE_BASE && m.img ? `<img src="${IMAGE_BASE}${m.img}" loading="lazy" onerror="this.remove()">` : '';
          const tags = (m.h ?? []).map((h) => `<span class="hint-tag" title="分拣提示">${h}</span>`).join('');
          chip.innerHTML = `${dot}${img}<span>${m.s}</span>${tags}`;
          chip.addEventListener('click', (e) => { e.stopPropagation(); toggleChip(m.n, b.brand, idx, e.shiftKey); });
          box.appendChild(chip);
        });
        card.appendChild(box);
      }
      card.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', 'brand:' + b.brand);
        e.dataTransfer.effectAllowed = 'move';
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
      card.addEventListener('click', (e) => e.stopPropagation());
      cards.appendChild(card);
    }
    if (!cards.children.length) cards.innerHTML = '<div class="empty-tip">拖品牌到这里</div>';
    const t = totals[tier.key];
    columns[tier.key].querySelector('.meta').textContent =
      `${t.brands} 品牌 · ${t.mice} 只` + (t.ov ? ` · ${t.ov} 调档` : '') + (q ? '（已过滤）' : '');
  }
}

function updateMetas() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const onlyOv = document.getElementById('only-overrides').checked;
  for (const tier of TIERS) {
    const brands = BRANDS.filter((b) => state[b.brand] === tier.key);
    const ov = brands.reduce((n, b) => n + b.models.filter((m) => overrides[m.n]).length, 0);
    columns[tier.key].querySelector('.meta').textContent =
      `${brands.length} 品牌 · ${brands.reduce((n, b) => n + b.count, 0)} 只`
      + (ov ? ` · ${ov} 调档` : '') + (q || onlyOv ? '（已过滤）' : '');
  }
}

function renderReview() {
  const box = document.getElementById('review');
  const entries = Object.entries(overrides).sort((a, b) => a[0].localeCompare(b[0]));
  if (!entries.length) {
    box.innerHTML = '<h3>调档清单</h3><div class="none">暂无型号级调整。展开品牌后点选型号,按 1-4 分档即可。</div>';
    return;
  }
  const groups = Object.fromEntries(TIERS.map((t) => [t.key, []]));
  for (const [name, tier] of entries) groups[tier].push(name);
  let html = '<h3>调档清单</h3>';
  for (const tier of TIERS) {
    if (!groups[tier.key].length) continue;
    html += `<div class="group-title" style="color:var(--${tier.colVar})">${tier.label} (${groups[tier.key].length})</div>`;
    for (const name of groups[tier.key]) {
      html += `<div class="row"><span class="name">${name}</span>`
        + `<span class="from">品牌档 ${TIER_LABEL[state[brandOf[name]]]}</span>`
        + `<button data-name="${name}">✕</button></div>`;
    }
  }
  box.innerHTML = html;
  box.querySelectorAll('button[data-name]').forEach((btn) => {
    btn.addEventListener('click', () => {
      const name = btn.dataset.name;
      delete overrides[name];
      persist();
      refreshChips([name]);
      updateMetas();
      renderReview();
    });
  });
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('only-overrides').addEventListener('change', render);
document.getElementById('review-toggle').addEventListener('click', () => {
  document.getElementById('review').classList.toggle('show');
  renderReview();
});
document.getElementById('reset').addEventListener('click', () => {
  state = { ...initialState };
  overrides = { ...initialOverrides };
  selectedModels.clear();
  selectedBrand = null;
  persist();
  render();
  renderReview();
  toast('已还原为当前线上名单');
});
document.getElementById('download').addEventListener('click', () => {
  const result = {
    easy: BRANDS.filter((b) => state[b.brand] === 'easy').map((b) => b.brand).sort(),
    normal: BRANDS.filter((b) => state[b.brand] === 'normal').map((b) => b.brand).sort(),
    disabled: BRANDS.filter((b) => state[b.brand] === 'disabled').map((b) => b.brand).sort(),
    modelOverrides: Object.fromEntries(Object.entries(overrides).sort((a, b) => a[0].localeCompare(b[0]))),
  };
  const json = JSON.stringify(result, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tier-assignment.json';
  a.click();
  URL.revokeObjectURL(a.href);
  const dist = Object.fromEntries(TIERS.map((t) => [t.key, 0]));
  for (const b of BRANDS) for (const m of b.models) dist[effectiveTier(m.n)]++;
  toast(`已导出 tier-assignment.json（小白 ${dist.beginner} · 潮男 ${dist.easy} · 扫地僧 ${dist.normal} · 禁用 ${dist.disabled}），跑 node scripts/apply-tier-assignment.mjs 落库`);
});

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const idx = ['1', '2', '3', '4'].indexOf(e.key);
  if (idx >= 0) {
    const tierKey = TIERS[idx].key;
    if (selectedModels.size) assignModels([...selectedModels], tierKey);
    else if (selectedBrand) { state[selectedBrand] = tierKey; cleanOverrides(selectedBrand); persist(); render(); }
  } else if (e.key === 'Escape') {
    selectedModels.clear();
    lastChip = null;
    refreshChipSelection();
    updateSelectionBar();
  }
});

let toastTimer;
function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

render();
renderReview();
</script>
</body>
