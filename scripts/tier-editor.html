<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>mousedle 难度分级编辑器</title>
<style>
  :root {
    --bg: #f7f5f0;
    --surface: #fffdf8;
    --border: #cec6bc;
    --text: #24211d;
    --text-sec: #625c54;
    --primary: #c83d00;
    --primary-soft: rgba(200, 61, 0, 0.1);
    --col-beginner: #16875b;
    --col-easy: #005fae;
    --col-normal: #625c54;
    --col-disabled: #ba1a1a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 12px 20px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  header h1 { font-size: 16px; margin: 0; }
  header .hint { font-size: 12px; color: var(--text-sec); }
  header .spacer { flex: 1; }
  input[type="search"] {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font: inherit;
    font-size: 13px;
    width: 220px;
    background: var(--surface);
  }
  button {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button:hover { filter: brightness(0.97); }
  #toast {
    position: fixed;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    background: #312b25;
    color: #f9eee8;
    padding: 8px 16px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.2s;
    pointer-events: none;
    z-index: 99;
  }
  #toast.show { opacity: 1; }
  main {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1.1fr 1.3fr 1fr;
    gap: 12px;
    padding: 12px 16px 20px;
    min-height: 0;
  }
  .column {
    display: flex;
    flex-direction: column;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    min-height: 0;
  }
  .column-header {
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
  }
  .column-header h2 { margin: 0; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  .column-header h2::before {
    content: '';
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: var(--col);
  }
  .column-header .meta { font-size: 12px; color: var(--text-sec); margin-top: 2px; }
  .cards {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 0;
  }
  .column.drag-over .cards { background: var(--primary-soft); outline: 2px dashed var(--primary); outline-offset: -6px; border-radius: 6px; }
  .card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 13px;
    cursor: grab;
    user-select: none;
  }
  .card:active { cursor: grabbing; }
  .card.dragging { opacity: 0.4; }
  .card.selected { outline: 2px solid var(--primary); outline-offset: -1px; background: var(--primary-soft); font-weight: 600; }
  .column.drop-target { background: var(--primary-soft); }
  .column.drop-target .column-header::after { content: '点这里放入'; font-size: 12px; color: var(--primary); font-weight: 600; }
  .card .count { color: var(--text-sec); font-size: 12px; white-space: nowrap; }
  .card.hidden { display: none; }
  .card .models {
    display: none;
    flex-basis: 100%;
    max-height: 200px;
    overflow-y: auto;
    margin-top: 6px;
    padding: 6px 10px;
    border-top: 1px solid var(--border);
    color: var(--text-sec);
    font-size: 12px;
    line-height: 1.7;
  }
  .card.expanded .models { display: block; }
  .card.expanded { flex-wrap: wrap; cursor: zoom-out; }
  .card .chev { color: var(--text-sec); font-size: 11px; white-space: nowrap; }
  .empty-tip {
    text-align: center;
    color: var(--text-sec);
    font-size: 12px;
    padding: 20px 0;
  }
</style>
</head>

const TIERS = [
  { key: 'beginner', label: '小白', colVar: '--col-beginner' },
  { key: 'easy', label: '潮男（含小白）', colVar: '--col-easy' },
  { key: 'normal', label: '扫地僧（含全部）', colVar: '--col-normal' },
  { key: 'disabled', label: '禁用（不进游戏）', colVar: '--col-disabled' },
];
const state = Object.fromEntries(BRANDS.map((b) => [b.brand, b.tier]));
const initial = { ...state };
const STORAGE_KEY = 'mousedle-tier-editor-state';
try {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) ?? 'null');
  if (saved && typeof saved === 'object') {
    for (const [brand, tier] of Object.entries(saved)) {
      if (brand in state && TIERS.some((t) => t.key === tier)) state[brand] = tier;
    }
  }
} catch { /* 损坏的存档按默认名单处理 */ }

function persist() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch { /* 忽略隐私模式 */ }
}

const board = document.getElementById('board');
const columns = {};
let selectedBrand = null;

function setSelected(brand) {
  selectedBrand = brand;
  render();
  document.querySelectorAll('.column').forEach((col) => col.classList.remove('drop-target'));
  if (!brand) return;
  const card = document.querySelector(`.card[data-brand="${CSS.escape(brand)}"]`);
  if (card) { card.classList.add('selected'); card.scrollIntoView({ block: 'nearest' }); }
  for (const tier of TIERS) {
    if (state[brand] !== tier.key) columns[tier.key].classList.add('drop-target');
  }
}

function moveTo(brand, tierKey) {
  if (state[brand] === tierKey) return;
  state[brand] = tierKey;
  persist();
  setSelected(brand);
}

for (const tier of TIERS) {
  const col = document.createElement('section');
  col.className = 'column';
  col.dataset.tier = tier.key;
  col.innerHTML = `
    <div class="column-header" style="--col: var(${tier.colVar})">
      <h2>${tier.label}</h2>
      <div class="meta"></div>
    </div>
    <div class="cards"></div>`;
  col.addEventListener('dragover', (e) => { e.preventDefault(); col.classList.add('drag-over'); });
  col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
  col.addEventListener('drop', (e) => {
    e.preventDefault();
    col.classList.remove('drag-over');
    const brand = e.dataTransfer.getData('text/plain');
    if (brand && state[brand] !== tier.key) {
      moveTo(brand, tier.key);
    }
  });
  // 点选交互:点卡片展开查看型号并选中;点列空白/列头把选中品牌移入该列
  col.addEventListener('click', (e) => {
    const card = e.target.closest('.card');
    if (card) {
      setSelected(selectedBrand === card.dataset.brand ? null : card.dataset.brand);
      return;
    }
    if (selectedBrand) moveTo(selectedBrand, tier.key);
  });
  board.appendChild(col);
  columns[tier.key] = col;
}

function render() {
  const filter = document.getElementById('search').value.trim().toLowerCase();
  const totals = Object.fromEntries(TIERS.map((t) => [t.key, 0]));
  for (const tier of TIERS) {
    const cards = columns[tier.key].querySelector('.cards');
    cards.innerHTML = '';
    const brands = BRANDS.filter((b) => state[b.brand] === tier.key)
      .sort((a, b) => b.count - a.count);
    for (const b of brands) {
      totals[tier.key] += b.count;
      const expanded = b.brand === selectedBrand;
      const card = document.createElement('div');
      card.className = 'card' + (expanded ? ' expanded' : '') + (filter && !b.brand.toLowerCase().includes(filter) ? ' hidden' : '');
      card.draggable = !expanded;
      card.dataset.brand = b.brand;
      card.innerHTML = `<span>${b.brand}</span><span class="count">${b.count} 型号</span><span class="chev">${expanded ? '收起' : '展开'}</span>`
        + (expanded ? `<div class="models">${(b.models ?? []).join('<br>') || '（无型号）'}</div>` : '');
      card.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', b.brand);
        e.dataTransfer.effectAllowed = 'move';
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', () => card.classList.remove('dragging'));
      cards.appendChild(card);
    }
    if (!brands.length) cards.innerHTML = '<div class="empty-tip">拖品牌到这里</div>';
    const visible = brands.filter((b) => !filter || b.brand.toLowerCase().includes(filter)).length;
    columns[tier.key].querySelector('.meta').textContent =
      `${brands.length} 个品牌 · ${totals[tier.key]} 只鼠标` + (filter ? `（匹配 ${visible}）` : '');
  }
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('reset').addEventListener('click', () => {
  Object.assign(state, initial);
  persist();
  setSelected(null);
  toast('已还原为当前线上名单');
});
document.getElementById('download').addEventListener('click', () => {
  const result = {
    beginner: BRANDS.filter((b) => state[b.brand] === 'beginner').map((b) => b.brand).sort(),
    easy: BRANDS.filter((b) => state[b.brand] === 'easy').map((b) => b.brand).sort(),
    disabled: BRANDS.filter((b) => state[b.brand] === 'disabled').map((b) => b.brand).sort(),
  };
  const json = JSON.stringify(result, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tier-assignment.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('已导出 tier-assignment.json，发给点点即可落库');
});

let toastTimer;
function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

render();
</script>
