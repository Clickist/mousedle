<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#141413" />
    <meta name="description" content="弗一把 - CS:GO / CS2 Major 选手猜测游戏，支持单人多难度与多人实时对战。" />
    <script>
      try {
        var storedUiTheme = localStorage.getItem('ui-theme');
        if (localStorage.getItem('ui-motion') === 'off') {
          document.documentElement.dataset.motion = 'reduced';
        }
        var initTheme =
          storedUiTheme === 'light'
            ? 'light'
            : storedUiTheme === 'dark' || storedUiTheme === 'blast'
              ? 'dark'
              : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
        document.documentElement.dataset.theme = initTheme;
        document.documentElement.style.colorScheme = initTheme === 'dark' ? 'dark' : 'light';
        document.documentElement.style.background = initTheme === 'dark' ? '#141413' : '#f7f5f0';
        var themeColorMeta = document.querySelector('meta[name="theme-color"]');
        if (themeColorMeta) themeColorMeta.content = initTheme === 'dark' ? '#141413' : '#f7f5f0';
        document.documentElement.dataset.themeReady = '';
      } catch (_) {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.style.background = '#141413';
        document.documentElement.dataset.themeReady = '';
      }
    </script>
    <title>弗一把 - CS Major 选手猜测游戏</title>
  </head>
  <body>
    <noscript>需要启用 JavaScript 才能运行本应用。/ JavaScript is required to run this app.</noscript>
    <div id="root"></div>
    <link rel="stylesheet" href="/src/styles/index.css" />
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
